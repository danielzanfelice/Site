<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA | Meu perfil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="feed.html" class="logo"><b>|</b> FURIA</a>
        <div class="nav-links">
            <span id="nome-perfil">Daniel</span>
            <div class="notificacao">
                <button class="sino">🔔 <span class="badge" id="badge">0</span></button>
                <div class="painel-notificacoes" id="painel-notificacoes">
                    <div class="notificacao-topo">
                        <h3>Notificações</h3>
                        <button onclick="limparNotificacoes()">Limpar</button>
                    </div>
                    <div id="lista-notificacoes">
                        <!-- Itens de notificação entram aqui -->
                    </div>
                </div>
            </div>
            <a href="perfil.html" class="btn-nav">Meu perfil</a>
            <a href="index.html" onclick="sair()">Sair</a>
        </div>
    </div>

    
    <div style="display: flex; max-width: 1100px; margin: 32px auto; padding: 0 20px; gap: 30px; align-items: flex-start;">
        
        
        <div style="flex: 1;">
            <div class="card" style="margin: 0; max-width: none;">
                
                <div class="perfil-cabecalho" style="position: relative; display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
                    <div class="avatar" id="avatar">
                        <img src="avatar-padrao.png" alt="Foto de perfil">
                    </div>
                    <div>
                        <h1>Meu perfil</h1>
                        <p>Usuário: <span id="usuario-nome-texto">daniel</span></p>
                    </div>

                    
                    <button id="btn-adicionar-amigo" style="display: none; position: absolute; top: 0; right: 0; background: transparent; border: 2px solid #e5151a; color: #ffffff; padding: 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease-in-out;" onclick="enviarPedidoAmizade()">
                        <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <circle cx="18" cy="14" r="5" stroke="#e5151a"></circle>
                            <line x1="18" y1="11" x2="18" y2="17" stroke="#e5151a"></line>
                            <line x1="15" y1="14" x2="21" y2="14" stroke="#e5151a"></line>
                        </svg>
                    </button>
                </div>

                <form id="form-perfil" onsubmit="event.preventDefault(); salvarPerfil();">
                    <label>E-mail</label>
                    <input type="email" id="email" required>

                    <label>Data de nascimento</label>
                    <input type="date" id="nascimento">

                    <label>Biografia</label>
                    <textarea id="bio" maxlength="500" placeholder="Fale um pouco sobre você..." oninput="contadorBio()"></textarea>
                    <small id="contador-bio">0/500 caracteres</small>

                    <label>Foto de perfil</label>
                    <input type="file" id="foto" accept="image/*" onchange="mostrarFotoPerfil(this)">
                    <span id="nome-foto-perfil">Nenhum arquivo escolhido</span>

                    <button type="submit" class="btn-principal">Salvar perfil</button>
                </form>

                <div class="links">
                    <a href="feed.html">Voltar ao feed</a>
                    <a href="suporte.html">Ir para suporte</a>
                </div>

                <div id="mensagem" class="mensagem" style="font-weight: bold; margin-top: 15px;"></div>

            </div>
        </div>

        
        <div class="card" style="width: 280px; margin: 0; padding: 24px; position: sticky; top: 20px;">
            <h3 style="margin-bottom: 16px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #fff; border-bottom: 1px solid #292929; padding-bottom: 8px;">
                Amigos (<span id="contagem-amigos">0</span>)
            </h3>
            <div id="lista-amigos-lateral" style="display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto;">
                <!-- Amigos entram dinamicamente aqui -->
            </div>
        </div>

    </div>

    
    <script src="script.js"></script>
    <script src="perfil.js"></script>

    
    <script>
    async function carregarListaAmigosLateral() {
        const containerAmigos = document.getElementById("lista-amigos-lateral");
        const contagemAmigos = document.getElementById("contagem-amigos");
        const usuarioLogado = localStorage.getItem("furiaUsuario");

        if (!containerAmigos || !usuarioLogado) return;

        try {
            const resposta = await fetch(`/amizades/lista?usuario=${usuarioLogado}`);
            if (resposta.ok) {
                const amigos = await resposta.json();
                containerAmigos.innerHTML = "";
                contagemAmigos.textContent = amigos.length;

                if (amigos.length === 0) {
                    containerAmigos.innerHTML = '<p style="color: #777; font-size: 12px; margin: 0;">Nenhum amigo aceito ainda.</p>';
                    return;
                }

                amigos.forEach(amigo => {
                    const divAmigo = document.createElement("div");
                    divAmigo.style.display = "flex";
                    divAmigo.style.alignItems = "center";
                    divAmigo.style.gap = "10px";
                    divAmigo.style.padding = "8px 0";
                    divAmigo.style.borderBottom = "1px solid #1f1f1f";

                    divAmigo.innerHTML = `
                        <div style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%;"></div>
                        <a href="perfil.html?user=${encodeURIComponent(amigo.nome_amigo.trim())}" style="color: #ccc; text-decoration: none; font-size: 13px; font-weight: bold; transition: color 0.2s;" onmouseover="this.style.color='#e5151a'" onmouseout="this.style.color='#ccc'">
                            @${amigo.nome_amigo}
                        </a>
                    `;
                    containerAmigos.appendChild(divAmigo);
                });
            }
        } catch (erro) {
            console.error("Erro ao carregar amigos na barra lateral:", erro);
        }
    }
    document.addEventListener("DOMContentLoaded", carregarListaAmigosLateral);
    </script>
</body>
</html>
