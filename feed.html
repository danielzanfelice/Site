<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA | Feed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    
    <div class="navbar" style="position: relative;">
        <a href="feed.html" class="logo"><b>|</b> FURIA</a>
        
        
        <div style="flex: 1; max-width: 500px; margin: 0 20px; position: relative;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="input-busca" placeholder="Pesquisar por publicações, usuários ou suportes..." style="flex: 1; padding: 8px 12px; border: 1px solid #292929; background: #0c0c0c; color: #fff; outline: none; font-family: inherit; font-size: 13px;">
                <button onclick="realizarBuscaUnificada()" class="btn-principal" style="width: auto; margin-top: 0; padding: 9px 18px; background: #e5151a; color: #fff; border: 0; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-size: 12px;">Buscar</button>
            </div>
            <div id="resultados-busca" style="margin-top: 5px; display: none; background: #161616; border: 1px solid #292929; border-radius: 4px; max-height: 300px; overflow-y: auto; position: absolute; width: 100%; z-index: 99999; box-shadow: 0px 4px 15px rgba(0,0,0,0.8);"></div>
        </div>

        <div class="nav-links">
            <span id="nome-perfil">DANIEL</span>
            <div class="notificacao">
                <button class="sino" onclick="abrirNotificacoes()">🔔 <span class="badge" id="badge">0</span></button>
                <div class="painel-notificacoes" id="painel-notificacoes">
                    <div class="notificacao-topo">
                        <h3>Notificações</h3>
                        <button onclick="limparNotificacoes()">Limpar</button>
                    </div>
                    <div id="lista-notificacoes">
                        <!-- Itens de notificação entram aqui -->
                    </div>
                </div>
            </div>
            <a href="perfil.html" class="btn-nav">Meu perfil</a>
            <a href="index.html" onclick="sair()">Sair</a>
        </div>
    </div>

    
    <div style="display: flex; max-width: 1100px; margin: 32px auto; padding: 0 20px; gap: 30px; align-items: flex-start;">
        
        <div style="flex: 1;">
            
            
            <div class="card" style="margin: 0 0 32px; max-width: none; padding: 12px 16px; border-radius: 30px; background: #161616; border: 1px solid #292929;">
                <form id="form-feed" onsubmit="event.preventDefault(); preencherTituloEEnviarPost();" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    
                    <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                        <!-- Input invisível de Título exigido pelo script original do feed -->
                        <input type="text" id="titulo" value="Nova publicação" style="display: none;">

                        <!-- Foto de Perfil Redonda do Usuário Logado -->
                        <div style="width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #292929; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
                            <img id="foto-perfil-feed-autor" src="avatar-padrao.png" alt="Sua foto" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>

                        <!-- Input de Texto Arredondado Horizontal -->
                        <div style="flex: 1; position: relative; background: #0c0c0c; border: 1px solid #292929; border-radius: 20px; padding: 2px 16px; display: flex; align-items: center;">
                            <textarea id="conteudo" maxlength="1000" oninput="contadorFeed()" required placeholder="No que você está pensando?" 
                                      style="width: 100%; height: 34px; max-height: 34px; resize: none; border: 0; background: transparent; color: #fff; outline: none; font-family: inherit; font-size: 13px; line-height: 34px; padding: 0; overflow: hidden; white-space: nowrap;"></textarea>
                        </div>

                        <!-- COLUNA DE AÇÕES DA DIREITA: FOTO EM CIMA E ENVIAR EMBAIXO -->
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;">
                            
                            <!-- Ícone de Anexar Imagem -->
                            <label for="foto-post" style="cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; padding: 2px; transition: color 0.2s;" onmouseover="this.style.color='#00ff00'" onmouseout="this.style.color='#888'" title="Adicionar foto">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </label>
                            <input type="file" id="foto-post" accept="image/*" onchange="mostrarNomeFotoEEnviar(this)" style="display: none;">

                            <!-- ÍCONE DE ENVIAR ADICIONADO EXATAMENTE NO LOCAL CIRCULADO -->
                            <button type="submit" style="background: transparent; border: 0; padding: 2px; cursor: pointer; color: #888; display: flex; align-items: center; justify-content: center; transition: color 0.2s;" onmouseover="this.style.color='#e5151a'" onmouseout="this.style.color='#888'" title="Enviar publicação">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- PRÉVIA DA IMAGEM DENTRO DO BALÃO -->
                    <div id="container-previa-foto" style="display: none; padding-left: 48px; position: relative; width: fit-content; max-width: 100%;">
                        <div style="position: relative; display: inline-block;">
                            <img id="img-previa-foto" src="" alt="Prévia da foto" style="max-height: 200px; max-width: 100%; border-radius: 12px; object-fit: cover; border: 1px solid #292929; display: block;">
                            <button type="button" onclick="removerFotoPrevia()" style="position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #fff; border: 0; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1;" title="Remover imagem">&times;</button>
                        </div>
                    </div>

                </form>
            </div>

            <h2>Feed</h2>
            <div id="container-posts">
                
            </div>

            <div class="links">
                <a href="suporte.html">Suporte</a>
            </div>
        </div>

        
        <div class="card" style="width: 280px; margin: 0; padding: 24px; position: sticky; top: 20px;">
            <h3 style="margin-bottom: 16px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #fff; border-bottom: 1px solid #292929; padding-bottom: 8px;">
                Amigos (<span id="contagem-amigos">0</span>)
            </h3>
            <div id="lista-amigos-lateral" style="display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto;">
                
            </div>
        </div>

    </div>

    
    <script src="script.js"></script>

    <script>
    function sincronizarFotoAutorNaBarra() {
        const usuarioLogado = localStorage.getItem("furiaUsuario") || "daniel";
        
        
        const nomeTopo = document.getElementById("nome-perfil");
        if (nomeTopo) nomeTopo.textContent = usuarioLogado.toUpperCase();

        const fotoSalvaExclusiva = localStorage.getItem("furiaFoto_" + usuarioLogado);
        const fotoSalvaGlobal = localStorage.getItem("furiaFoto");
        
        const fotoFinal = fotoSalvaExclusiva || fotoSalvaGlobal;
        const elementoImg = document.getElementById("foto-perfil-feed-autor");
        
        if (fotoFinal && elementoImg) {
            elementoImg.src = fotoFinal;
        }
    }

    document.getElementById("conteudo").addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            document.getElementById("btn-submeter-oculto").click();
        }
    });

    async function preencherTituloEEnviarPost() {
        const conteudoTxt = document.getElementById("conteudo").value.trim();
        const tituloInput = document.getElementById("titulo");
        
        if (conteudoTxt && tituloInput) {
            tituloInput.value = conteudoTxt.split(" ").slice(0, 4).join(" ") + "...";
        }
        await publicarPost();
        removerFotoPrevia();
    }

    function mostrarNomeFotoEEnviar(input) {
        const labelIcone = input.previousElementSibling;
        const containerPrevia = document.getElementById("container-previa-foto");
        const imgPrevia = document.getElementById("img-previa-foto");

        if (input.files && input.files[0]) {
            if (labelIcone) labelIcone.style.color = "#00ff00";
            if (imgPrevia && containerPrevia) {
                imgPrevia.src = URL.createObjectURL(input.files[0]);
                containerPrevia.style.display = "block";
            }
        }
    }

    function removerFotoPrevia() {
        const input = document.getElementById("foto-post");
        const containerPrevia = document.getElementById("container-previa-foto");
        const imgPrevia = document.getElementById("img-previa-foto");
        if (input) {
            input.value = "";
            const labelIcone = input.previousElementSibling;
            if (labelIcone) labelIcone.style.color = "#888";
        }
        if (imgPrevia) imgPrevia.src = "";
        if (containerPrevia) containerPrevia.style.display = "none";
    }

    async function carregarListaAmigosLateral() {
        const containerAmigos = document.getElementById("lista-amigos-lateral");
        const contagemAmigos = document.getElementById("contagem-amigos");
        const usuarioLogado = localStorage.getItem("furiaUsuario") || "daniel";

        if (!containerAmigos) return;

        try {
            const resposta = await fetch(`/amizades/lista?usuario=${usuarioLogado}`);
            if (resposta.ok) {
                const amigos = await resposta.json();
                containerAmigos.innerHTML = "";
                contagemAmigos.textContent = amigos.length;

                if (amigos.length === 0) {
                    containerAmigos.innerHTML = '<p style="color: #777; font-size: 12px; margin: 0;">Nenhum amigo aceito ainda.</p>';
                    return;
                }

                amigos.forEach(amigo => {
                    const divAmigo = document.createElement("div");
                    divAmigo.style.display = "flex";
                    divAmigo.style.alignItems = "center";
                    divAmigo.style.gap = "10px";
                    divAmigo.style.padding = "8px 0";
                    divAmigo.style.borderBottom = "1px solid #1f1f1f";

                        divAmigo.innerHTML = `
                        <div style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%;"></div>
                        <a href="perfil.html?user=${encodeURIComponent(amigo.nome_amigo.trim())}" style="color: #ccc; text-decoration: none; font-size: 13px; font-weight: bold; transition: color 0.2s;" onmouseover="this.style.color='#e5151a'" onmouseout="this.style.color='#ccc'">
                            @${amigo.nome_amigo}
                        </a>
                    `;
                    containerAmigos.appendChild(divAmigo);
                });
            }
        } catch (erro) {
            console.error("Erro ao carregar amigos na barra lateral:", erro);
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        sincronizarFotoAutorNaBarra();
        carregarListaAmigosLateral();
    });
    </script>
</body>
</html>
