<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA | Criar Conta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="logo"><b>|</b> FURIA</a>
    </div>

    <div class="container">
        <div class="card login-card">
            
            <h1 class="logo-grande"><b>|</b> FURIA</h1>
            <h2>Criar Conta</h2>

            <form id="form-registro" onsubmit="event.preventDefault(); registrarUsuario();">
                <label>Usuário</label>
                <input type="text" id="reg-usuario" required placeholder="Escolha um nome de usuário">

                <label>E-mail</label>
                <input type="email" id="reg-email" required placeholder="seu@email.com">

                <label>Senha</label>
                <input type="password" id="reg-senha" required placeholder="********">

                <label>Confirmar Senha</label>
                <input type="password" id="reg-confirmar-senha" required placeholder="********">

                <button type="submit" class="btn-principal">Criar Conta</button>
            </form>

            <div id="mensagem-registro" class="mensagem" style="font-weight: bold; margin-top: 15px;"></div>

            <hr>
            <button onclick="window.location.href='index.html'" class="btn-secundario">Já tenho conta / Voltar</button>

        </div>
    </div>

    
    <script>
    async function registrarUsuario() {
        const usuario = document.getElementById("reg-usuario").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const senha = document.getElementById("reg-senha").value;
        const confirmarSenha = document.getElementById("reg-confirmar-senha").value;
        const mensagem = document.getElementById("mensagem-registro");

        if (!usuario || !email || !senha || !confirmarSenha) {
            mensagem.style.color = "#e5151a";
            mensagem.textContent = "Preencha todos os campos!";
            return;
        }

        if (senha !== confirmarSenha) {
            mensagem.style.color = "#e5151a";
            mensagem.textContent = "As senhas não conferem!";
            return;
        }

        try {
            const resposta = await fetch("/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario, senha, email })
            });

            const dados = await resposta.json();

            if (resposta.ok || dados.sucesso) {
                mensagem.style.color = "#00ff00"; // SUCESSO EM VERDE
                mensagem.textContent = "Conta criada com sucesso! Redirecionando...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
            } else {
                mensagem.style.color = "#e5151a"; // ERRO EM VERMELHO
                mensagem.textContent = dados.mensagem || "Erro ao criar conta.";
            }
        } catch (erro) {
            console.error(erro);
            mensagem.style.color = "#e5151a";
            mensagem.textContent = "Erro ao conectar com o servidor.";
        }
    }
    </script>
</body>
</html>
