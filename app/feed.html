<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrei Valk — Feed da comunidade</title>
  <meta name="description" content="Veja as últimas postagens, curtidas e comentários da comunidade Vrei Valk.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="container">
    <h1>Feed</h1>
    <p class="subtitulo">O que está acontecendo no clã agora.</p>

    <div class="cartao">
      <label for="input-busca">Buscar</label>
      <input type="text" id="input-busca" placeholder="Buscar por título, texto ou usuário" oninput="realizarBusca()">
      <div id="resultados-busca"></div>
    </div>

    <div class="cartao">
      <h2 style="margin-top:0;font-size:14px">Publicação rápida</h2>
      <label for="titulo">Título</label>
      <input type="text" id="titulo" placeholder="Título da postagem" maxlength="120">

      <label for="conteudo">Conteúdo</label>
      <textarea id="conteudo" maxlength="1000" placeholder="Escreva algo para o clã..." oninput="contadorFeed()"></textarea>
      <div class="contador" id="contador-feed">0/1000</div>

      <label for="foto-post">Imagem (opcional)</label>
      <input type="file" id="foto-post" accept="image/*" onchange="mostrarNomeFoto(this)">
      <div class="arquivo" id="nome-foto">Nenhum arquivo escolhido</div>

      <button class="botao" style="margin-top:16px" onclick="publicarPost()">Publicar</button>
      <p class="mensagem" id="mensagem-feed"></p>
    </div>

    <div id="container-posts"></div>
  </main>

  <footer class="rodape">Vrei Valk — comunidade</footer>

  <script src="script.js"></script>
<script src="feed.js"></script>
    if (exigirLogin()) {
      montarTopo("feed.html");
      carregarPostagens();
    }
  </script>
</body>
</html>
