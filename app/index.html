<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrei Valk — Entrar na comunidade</title>
  <meta name="description" content="Entre na comunidade Vrei Valk: feed, postagens, perfil e suporte em um só lugar.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="tela-login">
    <div class="caixa-login">
      <img src="brasao.png" alt="Escudo Vrei Valk">
      <h1 style="display:none">Vrei Valk</h1>

      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="username">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') fazerLogin()">

      <button class="botao" onclick="fazerLogin()">Entrar</button>
      <p class="mensagem" id="mensagem"></p>

      <a class="link-abaixo" href="registro.html">Criar conta</a>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    if (usuarioAtual()) window.location.href = "feed.html";
  </script>
</body>
</html>
