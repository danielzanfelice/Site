<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrei Valk — Criar conta</title>
  <meta name="description" content="Crie sua conta Vrei Valk e participe do feed, das postagens e do suporte da comunidade.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="tela-login">
    <div class="caixa-login">
      <img src="brasao.png" alt="Escudo Vrei Valk">
      <h1>Criar conta</h1>

      <label for="novo-usuario">Usuário</label>
      <input type="text" id="novo-usuario" placeholder="Seu nome de guerra">

      <label for="novo-email">E-mail</label>
      <input type="email" id="novo-email" placeholder="voce@email.com">

      <label for="nova-senha">Senha</label>
      <input type="password" id="nova-senha" placeholder="Senha">

      <label for="confirmar-senha">Confirmar senha</label>
      <input type="password" id="confirmar-senha" placeholder="Repita a senha"
             onkeydown="if(event.key==='Enter') registrarConta()">

      <button class="botao" onclick="registrarConta()">Registrar</button>
      <p class="mensagem" id="mensagem"></p>

      <a class="link-abaixo" href="index.html">Já tenho conta</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
