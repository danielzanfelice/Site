<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrei Valk — Minhas postagens</title>
  <meta name="description" content="Gerencie suas postagens na Vrei Valk: criar, editar e excluir publicações.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="container">
    <h1>Minhas postagens</h1>
    <p class="subtitulo">Tudo que você publicou, com edição e exclusão.</p>

    <div class="cartao">
      <h2 style="margin-top:0;font-size:14px">Nova postagem</h2>
      <label for="titulo">Título</label>
      <input type="text" id="titulo" placeholder="Título da postagem" maxlength="120">

      <label for="conteudo">Conteúdo</label>
      <textarea id="conteudo" maxlength="1000" placeholder="Conte sua história..." oninput="contadorFeed()"></textarea>
      <div class="contador" id="contador-feed">0/1000</div>

      <label for="foto-post">Imagem (opcional)</label>
      <input type="file" id="foto-post" accept="image/*" onchange="mostrarNomeFoto(this)">
      <div class="arquivo" id="nome-foto">Nenhum arquivo escolhido</div>

      <button class="botao" style="margin-top:16px" onclick="publicarPost()">Publicar</button>
      <p class="mensagem" id="mensagem-feed"></p>
    </div>

    <div id="container-posts"></div>
  </main>

  <footer class="rodape">Vrei Valk — comunidade</footer>

  <script src="script.js"></script>
  <script>
    if (exigirLogin()) {
      montarTopo("postagens.html");
      window.filtroPostagens = usuarioAtual();
      carregarPostagens(usuarioAtual());
    }
  </script>
</body>
</html>
